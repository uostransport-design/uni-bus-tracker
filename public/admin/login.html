<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دخول الموظفين — نظام حافلات الجامعة</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f172a; font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }
  .box { background: white; border-radius: 14px; padding: 32px; width: 100%; max-width: 380px; }
  .box h1 { font-size: 19px; margin: 0 0 4px; color: #0f172a; }
  .box p { color: #64748b; font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #334155; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  #error { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; }
  a.back { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: #94a3b8; text-decoration: none; }
</style>
</head>
<body>
  <form class="box" id="login-form">
    <h1>🔐 دخول الموظفين</h1>
    <p>نظام تتبع حافلات جامعة الشارقة</p>
    <div id="error"></div>
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" required />
    <label>كلمة المرور</label>
    <input type="password" id="password" required />
    <button type="submit">تسجيل الدخول</button>
    <a class="back" href="/">⬅ رجوع للصفحة الرئيسية</a>
  </form>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل تسجيل الدخول');
        localStorage.setItem('bus_admin_token', data.token);
        localStorage.setItem('bus_admin_user', JSON.stringify(data.user));
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>

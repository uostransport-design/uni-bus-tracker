<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دخول الموظفين — نظام حافلات الجامعة</title>
<style>
  :root { --brand: #2eb386; --brand-dark: #1f8a68; --brand-darker: #145c46; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--brand-darker); font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }
  .box { background: white; border-radius: 14px; padding: 32px; width: 100%; max-width: 380px; position: relative; }
  .lang-btn { position: absolute; top: -40px; left: 0; background: rgba(255,255,255,.1); color: white; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  [dir="rtl"] .lang-btn { left: auto; right: 0; }
  .logo-img { width: 100%; max-width: 220px; margin: 0 auto 18px; display: block; border-radius: 8px; }
  .box h1 { font-size: 19px; margin: 0 0 4px; color: #0f172a; }
  .box p { color: #64748b; font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #334155; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light, #eafaf4); }
  button { width: 100%; padding: 12px; background: var(--brand); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:hover { background: var(--brand-dark); }
  #error { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; }
  a.back { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: #94a3b8; text-decoration: none; }
</style>
</head>
<body>
  <form class="box" id="login-form">
    <button type="button" class="lang-btn" id="lang-toggle">EN</button>
    <img class="logo-img" src="/assets/logo-icon-512-full.png" alt="University of Sharjah" />
    <h1 data-i18n="staffLoginTitle">🔐 دخول الموظفين</h1>
    <p data-i18n="staffLoginSubtitle">نظام تتبع حافلات جامعة الشارقة</p>
    <div id="error"></div>
    <label data-i18n="email">البريد الإلكتروني</label>
    <input type="email" id="email" required />
    <label data-i18n="password">كلمة المرور</label>
    <input type="password" id="password" required />
    <button type="submit" data-i18n="loginBtn">تسجيل الدخول</button>
    <a class="back" href="/" data-i18n="backHome">⬅ رجوع للصفحة الرئيسية</a>
  </form>

  <script src="../js/i18n.js"></script>
  <script>
    applyLang();
    document.getElementById('lang-toggle').addEventListener('click', () => setLang(getLang() === 'ar' ? 'en' : 'ar'));

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || t().loginFailed);
        localStorage.setItem('bus_admin_token', data.token);
        localStorage.setItem('bus_admin_user', JSON.stringify(data.user));
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>

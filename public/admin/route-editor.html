<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>رسم المسار يدويًا — لوحة الإدارة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --navy: #0f172a; --blue: #2563eb; --green: #16a34a; --red: #dc2626; --border: #e2e8f0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--navy); color: white; }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar a { color: #94a3b8; text-decoration: none; font-size: 13px; }
  .toolbar { display: flex; gap: 10px; padding: 10px 20px; background: #f1f5f9; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  .toolbar button { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-save { background: var(--green); color: white; }
  .btn-undo { background: #e2e8f0; color: #0f172a; }
  .btn-clear { background: #fee2e2; color: var(--red); }
  .btn-reset-osrm { background: #dbeafe; color: var(--blue); }
  .hint { font-size: 12.5px; color: #64748b; margin-inline-start: auto; }
  #map { width: 100%; height: calc(100vh - 96px); }
  #point-count { font-weight: 700; color: var(--blue); }
</style>
</head>
<body>
  <div class="topbar">
    <h1 id="route-title">🖊️ رسم المسار يدويًا</h1>
    <a href="/admin/dashboard.html">⬅ رجوع للوحة الإدارة</a>
  </div>

  <div class="toolbar">
    <button class="btn-undo" id="undo-btn">↩️ تراجع عن آخر نقطة</button>
    <button class="btn-clear" id="clear-btn">🗑️ مسح الكل</button>
    <button class="btn-reset-osrm" id="reset-osrm-btn">🔄 الرجوع للحساب التلقائي</button>
    <button class="btn-save" id="save-btn">💾 حفظ المسار (<span id="point-count">0</span> نقطة)</button>
    <span class="hint">انقر على الخريطة نقطة نقطة بمحاذاة الطريق الفعلي — المحطات تظهر كعلامات صفراء كمرجع</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/route-editor.js"></script>
</body>
</html>

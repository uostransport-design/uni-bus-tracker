<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تطبيق السائق — حافلات جامعة الشارقة</title>
<style>
  :root { --gold: #d4a017; --navy: #0b1220; --card: #111c33; --border: #1e2b47; --text: #f1f5f9; --muted: #94a3b8; --green: #16a34a; --red: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--navy); color: var(--text); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  .header-actions { display: flex; gap: 8px; }
  #lang-toggle, #logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  main { padding: 18px; max-width: 480px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  select, button { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  select { background: #0c1730; color: var(--text); border: 1px solid var(--border); }
  button.gold { background: var(--gold); color: #1a1a1a; }
  button.green { background: var(--green); color: white; }
  button.red { background: var(--red); color: white; }
  button.ghost { background: #0c1730; color: var(--text); border: 1px solid var(--border); }
  .status-line { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .trip-info h2 { font-size: 15px; margin: 0 0 4px; }
  .trip-info .stations { font-size: 13.5px; color: #cbd5e1; margin: 10px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #msg { font-size: 13px; margin-bottom: 12px; padding: 10px; border-radius: 8px; display: none; }
  #msg.ok { background: #14532d; color: #86efac; display: block; }
  #msg.err { background: #7f1d1d; color: #fca5a5; display: block; }
  .share-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #64748b; margin-left: 6px; }
  .share-dot.on { background: var(--green); }
</style>
</head>
<body>
  <header>
    <h1 id="driver-name" data-i18n="driverAppTitle">تطبيق السائق</h1>
    <div class="header-actions">
      <button id="lang-toggle">EN</button>
      <button id="logout" data-i18n="logout">خروج</button>
    </div>
  </header>

  <main>
    <div id="msg"></div>

    <div id="no-trip-view" class="card" style="display:none">
      <p class="status-line" data-i18n="chooseBus">اختر الحافلة التي ستقودها الآن</p>
      <select id="bus-select"></select>
      <button class="gold" id="start-trip-btn" data-i18n="startTrip">🚌 بدء الرحلة</button>
    </div>

    <div id="trip-view" class="card" style="display:none">
      <div class="trip-info">
        <h2 id="trip-bus-name">—</h2>
        <div class="status-line" id="trip-route-name">—</div>
        <div class="stations" id="trip-stations">—</div>
      </div>

      <button class="green" id="share-toggle"><span data-i18n="shareLocationStart">📍 بدء مشاركة الموقع</span> <span class="share-dot" id="share-dot"></span></button>
      <button class="ghost" id="end-trip-btn" data-i18n="endTrip">إنهاء الرحلة</button>

      <div class="grid2">
        <button class="ghost" onclick="reportIncident('breakdown')" data-i18n="reportBreakdown">🔧 عطل</button>
        <button class="ghost" onclick="reportIncident('congestion')" data-i18n="reportCongestion">🚦 ازدحام</button>
        <button class="ghost" onclick="reportIncident('accident')" data-i18n="reportAccident">⚠️ حادث</button>
        <button class="red" onclick="reportIncident('emergency')" data-i18n="reportEmergency">🆘 طارئ</button>
      </div>
      <button class="ghost" id="out-of-service-btn" style="margin-top:10px" data-i18n="outOfServiceBtn">إيقاف الحافلة عن الخدمة</button>
    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
